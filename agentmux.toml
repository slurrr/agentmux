[defaults]
host = "0.0.0.0"
port = 8000
dtype = "bfloat16"
gpu_memory_utilization = 0.9
max_model_len = 8192
max_num_seqs = 8
tensor_parallel_size = 1

[defaults.env]
CUDA_VISIBLE_DEVICES = "0"

[profiles.qwen2_5_7b]
model = "Qwen/Qwen2.5-7B-Instruct"
served_model_name = "qwen2.5-7b"
attention_backend = "FLASH_ATTN"
notes = "Balanced default for a single 4090."
extra_args = ["--enable-prefix-caching"]

[profiles.deepseek_r1_distill_qwen_14b]
model = "deepseek-ai/DeepSeek-R1-Distill-Qwen-14B"
served_model_name = "deepseek-r1-14b"
max_model_len = 16384
max_num_seqs = 4
gpu_memory_utilization = 0.92
attention_backend = "FLASH_ATTN"
notes = "Heavier profile for the 24 GB card."
extra_args = ["--enable-prefix-caching"]
