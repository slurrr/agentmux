[stack]
name = "omnicoder_oc"
track = "core"
primary_service = "main"
notes = "Minimal tool-capable Qwen3.5 base for agent testing through an OpenAI-compatible frontend."

[defaults]
host = "0.0.0.0"

[defaults.args]
dtype = "bfloat16"
gpu_memory_utilization = 0.971
max_num_seqs = 1
tensor_parallel_size = 1

[services.main]
engine = "vllm"
model = "${QUANT_ROOT}/omnicoder-9b/fp8/current"
port = 8002
served_model_name = "omnicoder-9b"
# host = "127.0.0.1"
# notes = ""
# extra_args = ["--disable-log-requests"]

[services.main.env]
# CUDA_VISIBLE_DEVICES = "0"
# HF_TOKEN = "${HF_TOKEN}"
# VLLM_API_KEY = "${VLLM_API_KEY}"
VLLM_MEMORY_PROFILER_ESTIMATE_CUDAGRAPHS= "1"

[services.main.args]
enable_prefix_caching = true
# max_model_len = 72896
enable_auto_tool_choice = true
tool_call_parser = "qwen3_xml"
exclude_tools_when_tool_choice_none = true
# performance_mode = "interactivity"
enable_force_include_usage = true
# attention_backend = "FLASH_ATTN"
chat_template_content_format = "openai"
# default_chat_template_kwargs = "{\"enable_thinking\": false}"
trust_request_chat_template = false
trust_remote_code = true
# generation_config = "auto"
# kv_cache_memory_bytes overrides estimate for kv cache and does not respect gpu_memory_utilization
kv_cache_memory_bytes = "11156174991"
kv_cache_dtype = "fp8_e4m3"
# calculate_kv_scales = true

# structured_outputs_config = "{\"backend\":\"auto\"}"
# tool_server = "http://127.0.0.1:9000"

# Request-time knobs stay in the frontend or client request body:
# - temperature
# - top_p
# - max_tokens
# - tool_choice
# - parallel_tool_calls

[services.main.assets]
# chat_template = "assets/chat_templates/qwen3_codex_compat.jinja"
# tokenizer intentionally omitted for first-pass default tokenizer behavior

