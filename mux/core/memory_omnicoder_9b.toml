[stack]
name = "pi_ghosty"
track = "core"
primary_service = "llm"
notes = "Minimal tool-capable Qwen3.5 base for agent testing through an OpenAI-compatible frontend."

[defaults]
host = "0.0.0.0"

[defaults.env]


[defaults.args]
dtype = "bfloat16"
gpu_memory_utilization = 0.98
max_num_seqs = 4
tensor_parallel_size = 1

[services.llm]
engine = "vllm"
runtime_bin_dir = ".venv-vllm/bin"
model = "${QUANT_ROOT}/omnicoder-9b/fp8/current"
port = 8002
# host = "127.0.0.1"
served_model_name = "omnicoder-9b"
# notes = ""
extra_args = ["--disable-uvicorn-access-log"]

[services.llm.env]
# CUDA_VISIBLE_DEVICES = "0"
VLLM_MEMORY_PROFILER_ESTIMATE_CUDAGRAPHS = "1"

[services.llm.args]
enable_prefix_caching = true
max_model_len = 148928
enable_auto_tool_choice = true
tool_call_parser = "qwen3_xml"
exclude_tools_when_tool_choice_none = true
# performance_mode = "interactivity"
enable_force_include_usage = true
# attention_backend = "FLASH_ATTN"
chat_template_content_format = "openai"
# default_chat_template_kwargs = "{\"enable_thinking\": false}"
# generation_config = "auto"

# kv_cache_memory_bytes overrides estimate for kv cache and does not respect gpu_memory_utilization
# kv_cache_memory_bytes = "11156174991"
kv_cache_dtype = "fp8_e4m3"

# structured_outputs_config = "{\"backend\":\"auto\"}"

[services.llm.assets]

[services.memory]
engine = "hindsight"
host = "127.0.0.1"
port = 8888
runtime_bin_dir = ".venv-hindsight/bin"
data_dir = "${HINDSIGHT_DATA_ROOT}"
llm_service = "llm"
# retain_extraction_mode: "verbose" 

[services.memory.env]
HINDSIGHT_API_EMBEDDINGS_PROVIDER = "local"
HINDSIGHT_API_EMBEDDINGS_LOCAL_FORCE_CPU = "true"

HINDSIGHT_API_RERANKER_PROVIDER = "local"
HINDSIGHT_API_RERANKER_LOCAL_FORCE_CPU = "true"
HINDSIGHT_API_RERANKER_LOCAL_BUCKET_BATCHING = "true"

HINDSIGHT_API_LAZY_RERANKER = "true"