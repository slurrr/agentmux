[mux]
name = "example-exl3-tabby"
primary_service = "main"
notes = "Normal AgentMux shape: consume the workspace export, choose identity and host port."

[services.main]
workspace_export = "./exports/example-exl3-tabby"
container_name = "agentmux-example-exl3-tabby-main"
port = 8002

# Optional escape hatch: AgentMux can still add mux-local mounts when needed.
# The workspace export should already contain backend-required mounts.
# [[services.main.volumes]]
# source = "~/data/some-agent-sidecar-input"
# target = "/agentmux/extra"
# mode = "ro"
