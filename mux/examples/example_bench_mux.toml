[stack]
name = "example_bench_mux"
track = "examples"
primary_service = "main"
notes = "Benchmark-only baseline mux. Copy into mux/bench/ and change only model, served_model_name, and port unless you intentionally want a different benchmark envelope."

[services.main]
engine = "vllm"
model = "${MODEL_ROOT}/REPLACE_WITH_MODEL_PATH"
served_model_name = "REPLACE_WITH_MODEL_NAME"
host = "127.0.0.1"
port = 8100
notes = "Phase-1 benchmark baseline: modest context, neutral generation defaults, and no benchmark-specific hacks."

[services.main.args]
generation_config = "vllm"
max_model_len = 8192
gpu_memory_utilization = 0.9

[services.main.env]
CUDA_VISIBLE_DEVICES = "0"
