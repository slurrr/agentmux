[agentmux_export]
version = 1
name = "example-exl3-tabby"
backend = "exl3-tabby"
notes = "Example of what workspace-exl3 should export after a preset is promoted."

[service]
image = "localhost/llm-tabby:latest"
port = 8002
health_path = "/v1/models"
runtime_target = "/app/data"
podman_args = ["--security-opt", "label=disable", "--device", "nvidia.com/gpu=all"]

[service.env]
HF_HOME = "/models/hf"

[[service.volumes]]
source = "~/models"
target = "/models"
mode = "ro"

[[service.volumes]]
source = "./tabby-config.yml"
target = "/app/tabbyAPI/config.yml"
mode = "ro"

[[service.volumes]]
source = "./templates"
target = "/app/tabbyAPI/templates"
mode = "ro"

[[service.volumes]]
source = "./sampler_overrides"
target = "/app/tabbyAPI/sampler_overrides"
mode = "ro"

[[service.volumes]]
source = "./loras"
target = "/app/tabbyAPI/loras"
mode = "ro"
