# Multimodal and media:
# allowed_local_media_path = "/home/poop/ml/media"
# allowed_media_domains = "['example.com']"
# limit_mm_per_prompt = "{\"image\":4}"
# media_io_kwargs = "{\"image\":{\"rgb\":true}}"
# mm_processor_kwargs = "{\"do_resize\":true}"
# mm_processor_cache_gb = 4

# LoRA capacity:
# max_loras = 2
# max_lora_rank = 64
# max_cpu_loras = 4
# lora_dtype = "auto"
# fully_sharded_loras = false

[services.generalist]
engine = "vllm"
model = "${MODEL_ROOT}/Qwen2.5-7B-Instruct"
port = 8000
served_model_name = "qwen2.5-7b"
notes = "General-purpose instruction model with a custom chat template and an optional LoRA."

[services.generalist.args]
attention_backend = "FLASH_ATTN"
# tokenizer = "${MODEL_ROOT}/Qwen2.5-7B-Instruct"
# tokenizer_mode = "auto"
# generation_config = "auto"
# max_logprobs = 20
# logprobs_mode = "raw_logprobs"
# enable_force_include_usage = true

[services.generalist.assets]
chat_template = "assets/chat_templates/qwen25_default.jinja"
system_prompt = "assets/prompts/generalist_system.md"

[[services.generalist.loras]]
name = "planner"
path = "${LORA_ROOT}/planner-lora"
base_model = "${MODEL_ROOT}/Qwen2.5-7B-Instruct"
enabled = false

[services.reasoner]
engine = "vllm"
model = "${MODEL_ROOT}/DeepSeek-R1-Distill-Qwen-14B"
port = 8001
served_model_name = "deepseek-r1-14b"
notes = "Heavier reasoning-oriented variant with a few service-level overrides."
extra_args = ["--disable-log-requests"]

[services.reasoner.env]
CUDA_VISIBLE_DEVICES = "1"

[services.reasoner.args]
gpu_memory_utilization = 0.92
max_num_seqs = 4
max_model_len = 16384
swap_space = 0
attention_backend = "FLASH_ATTN"
# reasoning_parser = "deepseek_r1"
# tool_call_parser = "hermes"
# enable_auto_tool_choice = true
# structured_outputs_config = "{\"backend\":\"auto\",\"reasoning_parser\":\"deepseek_r1\"}"

[services.reasoner.assets]
chat_template = "assets/chat_templates/deepseek_reasoning.jinja"

[services.coder]
engine = "vllm"
model = "${MODEL_ROOT}/Qwen2.5-Coder-7B-Instruct"
port = 8003
served_model_name = "qwen2.5-coder-7b"
notes = "Example coding-oriented service with repeatable extra args."
extra_args = [
  "--disable-log-requests",
  "--allowed-local-media-path",
  "/home/poop/ml/workspace",
]

[services.coder.args]
max_model_len = 32768
max_num_seqs = 12
attention_backend = "FLASH_ATTN"
# tool_call_parser = "qwen3_coder"
# enable_auto_tool_choice = true
# generation_config = "auto"
# override_generation_config = "{\"temperature\":0.1}"
# rope_scaling = "{\"rope_type\":\"dynamic\",\"factor\":2.0}"

[services.coder.assets]
chat_template = "assets/chat_templates/coder.jinja"
system_prompt = "assets/prompts/coder_system.md"
