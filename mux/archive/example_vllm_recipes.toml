[stack]
name = "example_vllm_recipes"
track = "archive"
primary_service = "generalist"
notes = "Reference-only example showing a robust vLLM recipe surface with multiple services, defaults, LoRAs, assets, and generic args."

[defaults]
host = "0.0.0.0"

[defaults.env]
CUDA_VISIBLE_DEVICES = "0"
# HF_TOKEN = "${HF_TOKEN}"
# VLLM_API_KEY = "${VLLM_API_KEY}"
# HF_HOME = "${CACHE_ROOT}/hf"

[defaults.args]
dtype = "bfloat16"
gpu_memory_utilization = 0.9
max_num_seqs = 8
tensor_parallel_size = 1
max_model_len = 8192
enable_prefix_caching = true

[defaults.assets]
tokenizer = "${MODEL_ROOT}/SharedTokenizer"

# Model, tokenizer, and loading:
