[stack]
name = "example_hindsight_memory"
track = "archive"
primary_service = "main"
notes = "Reference-only example: vLLM service with optional hindsight sidecar."

[defaults]
host = "0.0.0.0"

[defaults.args]
dtype = "bfloat16"
gpu_memory_utilization = 0.9
enable_prefix_caching = true

[services.main]
engine = "vllm"
model = "${MODEL_ROOT}/Qwen2.5-7B-Instruct"
port = 8000
served_model_name = "qwen2.5-7b"

[services.main.args]
attention_backend = "FLASH_ATTN"

[services.main.assets]
chat_template = "assets/chat_templates/qwen25_default.jinja"

[stack.memory]
provider = "hindsight"
host = "127.0.0.1"
port = 8888
data_dir = "~/data/hindsight"