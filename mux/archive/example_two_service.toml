[stack]
name = "example_two_service"
track = "archive"
primary_service = "router_default"
notes = "Reference-only example showing future multi-service stack shape."

[defaults]
host = "0.0.0.0"
dtype = "bfloat16"
gpu_memory_utilization = 0.85
max_model_len = 4096
max_num_seqs = 8
tensor_parallel_size = 1

[defaults.env]
CUDA_VISIBLE_DEVICES = "0"

[services.router_default]
engine = "vllm"
model = "Qwen/Qwen2.5-3B-Instruct"
port = 8010
served_model_name = "qwen2.5-3b"
notes = "Generalist service example."

[services.coder]
engine = "vllm"
model = "Qwen/Qwen2.5-Coder-7B-Instruct"
port = 8011
served_model_name = "qwen2.5-coder-7b"
notes = "Secondary coding-focused service example."
