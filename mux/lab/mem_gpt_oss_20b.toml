[stack]
name = "oss_mem"
track = "lab"
primary_service = "llm"
notes = "gpt-oss-20b with Hindsight memory, set up in the same split-env shape as the other memory stacks."

[defaults.args]
dtype = "bfloat16"
load_format = "auto"
gpu_memory_utilization = 0.95
max_num_seqs = 36

[services.llm]
engine = "vllm"
runtime_bin_dir = ".venv-vllm/bin"
model = "${MODEL_ROOT}/hf-snapshots/gpt-oss-20b/current"
port = 8002
served_model_name = "gpt-oss-20b"

[services.llm.env]
VLLM_MEMORY_PROFILER_ESTIMATE_CUDAGRAPHS = "0"
PYTORCH_CUDA_ALLOC_CONF = "expandable_segments:True"

[services.llm.args]
enable_prefix_caching = true
# max_model_len = 65536
generation_config = "vllm"

# Memory retain/consolidation does not need tool calling; disable to reduce
# parser/tooling surface area and keep outputs more deterministic.
enable_auto_tool_choice = true
tool_call_parser = "openai"
reasoning_parser = "openai_gptoss"
exclude_tools_when_tool_choice_none = true
enable_force_include_usage = true

# Parity with the Gemma memory mux: enforce structured outputs at the vLLM layer.
# Keep disable_any_whitespace=false for stability.
structured_outputs_config = '{"backend":"xgrammar","reasoning_parser":"openai_gptoss","enable_in_reasoning":false,"disable_any_whitespace":false}'

# uses harmony so leave out
# chat_template_content_format = "openai"

[services.memory]
engine = "hindsight"
host = "127.0.0.1"
port = 8888
runtime_bin_dir = ".venv-hindsight/bin"
data_dir = "${HINDSIGHT_DATA_ROOT}"
llm_service = "llm"

[services.memory.env]
HINDSIGHT_API_EMBEDDINGS_PROVIDER = "local"
HINDSIGHT_API_EMBEDDINGS_LOCAL_FORCE_CPU = "true"

HINDSIGHT_API_RERANKER_PROVIDER = "local"
HINDSIGHT_API_RERANKER_LOCAL_FORCE_CPU = "true"
HINDSIGHT_API_LAZY_RERANKER = "true"

HINDSIGHT_API_RETAIN_LLM_PROVIDER = "openai"
HINDSIGHT_API_RETAIN_LLM_MODEL = "gpt-oss-20b"
HINDSIGHT_API_CONSOLIDATION_LLM_PROVIDER = "openai"
HINDSIGHT_API_CONSOLIDATION_LLM_MODEL = "gpt-oss-20b"
