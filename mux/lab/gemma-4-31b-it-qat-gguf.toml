[stack]
name = "gem-qat"
track = "lab"
primary_service = "llm"
notes = "Minimal llama.cpp (llama-server) stack for Gemma 4 31B GGUF. Intended for GPU serving + OpenAI-compatible clients."

[defaults]
host = "127.0.0.1"

[defaults.env]
CUDA_VISIBLE_DEVICES = "0"

[services.llm]
engine = "llamacpp"

# If you prefer explicitness, uncomment and point at a dir containing llama-server.
# runtime_bin_dir = "~/.local/bin"

# GGUF model to serve.
model = "unsloth/gemma-4-31B-it-qat-GGUF"

host = "127.0.0.1"
port = 8002

# Optional: informational label.
served_model_name = "gemma-4-31b-qat"

# Minimal GPU-serving baseline (order-independent).
# If this fails due to VRAM pressure, try:
# - n_gpu_layers = "auto" (instead of "all")
# - smaller ctx_size
# - lower parallel

[services.llm.args]
n_gpu_layers = "all"
threads = 8
ctx_size = 102400
# Hindsight llama.cpp experiment: current auto startup exposes 4 slots on this
# 4090 with ~1.6 GiB VRAM free, so make that explicit. Tune down if per-request
# TPS/latency collapses under memory workload.
parallel = 4
threads_http = 4
metrics = true
flash_attn = "on"
cache_type_k = "q4_0"
cache_type_v = "q4_0"
fit = "off"
# chat_template = "assets/chat_templates/gemma_4_model_author_template.jinja"
# chat_template_kwargs = '{"enable_thinking":false}'

# Optional tweaks:
# parallel = 2
# flash_attn = "auto"
# chat_template = "gemma"
# mmproj = "/home/poop/models/local/hf-snapshots/gemma-4-31b-it-gguf-llamacpp/current/mmproj-BF16.gguf"
