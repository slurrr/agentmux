[stack]
name = "qwen3_5_9b"
track = "lab"
primary_service = "main"
notes = "Minimal tool-capable Qwen3.5 base for agent testing through an OpenAI-compatible frontend."

[defaults]
host = "0.0.0.0"

[defaults.args]
dtype = "bfloat16"
gpu_memory_utilization = 0.933
max_num_seqs = 1
tensor_parallel_size = 1


[services.main]
engine = "vllm"
model = "${MODEL_ROOT}/Qwen3.5-9B"
port = 8002
served_model_name = "Qwen3.5-9B"
# host = "127.0.0.1"
# notes = ""
# extra_args = ["--disable-log-requests"]

[services.main.env]
# CUDA_VISIBLE_DEVICES = "0"
# HF_TOKEN = "${HF_TOKEN}"
# VLLM_API_KEY = "${VLLM_API_KEY}"

[services.main.args]
enable_prefix_caching = true
max_model_len = 16384
enable_auto_tool_choice = true
tool_call_parser = "qwen3_xml"
exclude_tools_when_tool_choice_none = true
performance_mode = "interactivity"
enable-force-include-usage = true
# attention_backend = "FLASH_ATTN"
chat_template_content_format = "openai"
# trust_request_chat_template = false
# generation_config = "auto"

# swap_space = 0
# structured_outputs_config = "{\"backend\":\"auto\"}"
# tool_server = "http://127.0.0.1:9000"

# Request-time knobs stay in the frontend or client request body:
# - temperature
# - top_p
# - max_tokens
# - tool_choice
# - parallel_tool_calls

[services.main.assets]
chat_template = "assets/chat_templates/qwen3_codex_compat.jinja"

