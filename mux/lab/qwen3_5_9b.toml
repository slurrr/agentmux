[stack]
name = "qwen3_5"
track = "lab"
primary_service = "llm"
notes = "Minimal tool-capable Qwen3.5 multi-modal-model."

[defaults]
# host = "0.0.0.0"

[defaults.args]
dtype = "bfloat16"
load_format = "auto"
gpu_memory_utilization = 0.98
max_num_seqs = 10

[services.llm]
engine = "vllm"
runtime_bin_dir = ".venv-vllm/bin"
model = "${MODEL_ROOT}/hf-snapshots/qwen3.5-9b/current"
port = 8002
served_model_name = "qwen3.5_9b"
# extra_args = ["--disable-log-requests"]

[services.llm.env]
VLLM_MEMORY_PROFILER_ESTIMATE_CUDAGRAPHS = "0"
PYTORCH_CUDA_ALLOC_CONF = "expandable_segments:True"

[services.llm.args]
enable_prefix_caching = true
max_model_len = 73728
enable_auto_tool_choice = true
tool_call_parser = "qwen3_xml"
reasoning_parser = "qwen3"
exclude_tools_when_tool_choice_none = true
# performance_mode = "interactivity"
enable-force-include-usage = true
chat_template_content_format = "openai"
default_chat_template_kwargs = "{\"enable_thinking\":true}"
# trust_request_chat_template = false
# generation_config = "auto"
# kv_cache_memory_bytes = "10466787727"
kv_cache_dtype = "fp8_e4m3"

# calculate_kv_scales = true *does not work with qwen's hybrid attention (works with omnicoder i think)
# limit_mm_per_prompt = "{\"image\":1}"
# language_model_only = true

# swap_space = 0
# structured_outputs_config = "{\"backend\":\"auto\"}"
# tool_server = "http://127.0.0.1:9000"

[services.llm.assets]
chat_template = "assets/chat_templates/qwen3_codex_compat.jinja"
