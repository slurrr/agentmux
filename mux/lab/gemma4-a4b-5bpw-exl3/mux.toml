[mux]
name = "gemma4-a4b-5bpw-exl3"
primary_service = "main"
notes = "Lab-editable AgentMux export for proven gemma4-a4b-4-20-5-00bpw-h8-hq EXL3/TabbyAPI serving preset from workspace-exl3."

[services.main]
image = "localhost/llm-tabby:latest"
container_name = "agentmux-gemma4-a4b-5bpw-exl3-main"
port = 8002
container_port = 5000
podman_args = ["--security-opt", "label=disable", "--device", "nvidia.com/gpu=all"]
health_path = "/v1/models"

[services.main.env]
EXLLAMAV3_TUNE_CACHE = "/runs/exllamav3-autotune/coop_autotune_v1.bin"

[[services.main.volumes]]
source = "/home/poop/models/local/exl3/gemma4-a4b-4.20-cook/candidates/gemma4-a4b-4.20-5.00bpw-h8-hq"
target = "/models/gemma4-a4b-4-20-5-00bpw-h8-hq"
mode = "ro"

[[services.main.volumes]]
source = "./config/tabby-config.direct-bind.yml"
target = "/app/tabbyAPI/config.yml"
mode = "ro"

[[services.main.volumes]]
source = "./config/sampler_overrides"
target = "/app/tabbyAPI/sampler_overrides"
mode = "ro"

[[services.main.volumes]]
source = "./config/templates"
target = "/app/tabbyAPI/templates"
mode = "ro"

[[services.main.volumes]]
source = "./config/api_tokens.yml"
target = "/app/tabbyAPI/api_tokens.yml"
mode = "ro"
