[mux]
name = "v6"
primary_service = "main"
notes = "Lab-editable AgentMux export for proven v6 EXL3/TabbyAPI serving preset from workspace-exl3."

[services.main]
image = "localhost/llm-tabby:exllamav3-1.4.4-cu132-tabby-fcc1a107-cuda13.2.1"
container_name = "agentmux-v6-main"
port = 8002
container_port = 5000
podman_args = ["--security-opt", "label=disable", "--device", "nvidia.com/gpu=all"]
health_path = "/v1/models"

[services.main.env]
EXLLAMAV3_TUNE_CACHE = "/runs/exllamav3-autotune/coop_autotune_v1.bin"
EXL3_QC_STAGING = "0"
EXL3_BC_ATTN = "1"
EXL3_BC_ATTN_TRACE = "0"

[[services.main.volumes]]
source = "/home/poop/models/hf/hub/models--turboderp--Qwen3.8-27B-exl3/snapshots/516bf129059031c6da9416768ea6b7a1be00a8fc"
target = "/models/v6"
mode = "ro"

[[services.main.volumes]]
source = "/home/poop/models/hf/hub/models--turboderp--Qwen3.8-27B-exl3/blobs"
target = "/blobs"
mode = "ro"

[[services.main.volumes]]
source = "./config/tabby-config.direct-bind.yml"
target = "/app/tabbyAPI/config.yml"
mode = "ro"

[[services.main.volumes]]
source = "./config/sampler_overrides"
target = "/app/tabbyAPI/sampler_overrides"
mode = "ro"

[[services.main.volumes]]
source = "./config/templates"
target = "/app/tabbyAPI/templates"
mode = "ro"

[[services.main.volumes]]
source = "./config/api_tokens.yml"
target = "/app/tabbyAPI/api_tokens.yml"
mode = "ro"
