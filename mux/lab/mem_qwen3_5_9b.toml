[stack]
name = "qwen3_5_mem"
track = "lab"
primary_service = "llm"
notes = "Minimal tool-capable Qwen3.5 multi-modal-model. fp8-block with hindsight memory"

[defaults]
# host = "0.0.0.0"

[defaults.args]
dtype = "bfloat16"
load_format = "auto"
gpu_memory_utilization = 0.98
max_num_seqs = 36

[services.llm]
engine = "vllm"
runtime_bin_dir = ".venv-vllm/bin"
model = "${MODEL_ROOT}/hf-snapshots/qwen3.5-9b/current"
port = 8002
served_model_name = "qwen3.5_9b"
# extra_args = ["--disable-log-requests"]

[services.llm.env]
VLLM_MEMORY_PROFILER_ESTIMATE_CUDAGRAPHS = "0"
PYTORCH_CUDA_ALLOC_CONF = "expandable_segments:True"

[services.llm.args]
enable_prefix_caching = true
max_model_len = 73728
enable_auto_tool_choice = true
tool_call_parser = "qwen3_xml"
reasoning_parser = "qwen3"
exclude_tools_when_tool_choice_none = true
# performance_mode = "interactivity"
enable-force-include-usage = true
chat_template_content_format = "openai"
default_chat_template_kwargs = "{\"enable_thinking\":false}"
# trust_request_chat_template = false
# generation_config = "auto"
# kv_cache_memory_bytes = "10466787727"
kv_cache_dtype = "fp8_e4m3"

[services.llm.assets]
chat_template = "assets/chat_templates/qwen3.5_hf_fix_chat_template.jinja"

[services.memory]
engine = "hindsight"
host = "127.0.0.1"
port = 8888
runtime_bin_dir = ".venv-hindsight/bin"
data_dir = "${HINDSIGHT_DATA_ROOT}"
llm_service = "llm"

[services.memory.env]
HINDSIGHT_API_EMBEDDINGS_PROVIDER = "local"
HINDSIGHT_API_EMBEDDINGS_LOCAL_FORCE_CPU = "true"

HINDSIGHT_API_RERANKER_PROVIDER = "local"
HINDSIGHT_API_RERANKER_LOCAL_FORCE_CPU = "true"

# HINDSIGHT_API_RERANKER_LOCAL_BUCKET_BATCHING = "true"
# HINDSIGHT_API_RERANKER_LOCAL_BATCH_SIZE = "64"
# HINDSIGHT_API_RERANKER_LOCAL_MAX_CONCURRENT = "4"
# HINDSIGHT_API_RERANKER_MAX_CANDIDATES = "100"
HINDSIGHT_API_LAZY_RERANKER = "true"

# First consolidation knobs to test.
# Goal: reduce prompt size / per-round work before touching worker topology.
# HINDSIGHT_API_CONSOLIDATION_LLM_BATCH_SIZE = "8"
# HINDSIGHT_API_CONSOLIDATION_MAX_MEMORIES_PER_ROUND = "32"
# HINDSIGHT_API_CONSOLIDATION_SOURCE_FACTS_MAX_TOKENS = "2048"
# HINDSIGHT_API_CONSOLIDATION_SOURCE_FACTS_MAX_TOKENS_PER_OBSERVATION = "160"

# gememi DR, could alternatively drop memories per round to 16 and leave at default 300s 
HINDSIGHT_API_WORKER_POLLER_TIMEOUT = "666"
HINDSIGHT_API_RETAIN_LLM_TIMEOUT = "420"

# Optional follow-up knobs if the first set is still too slow.
# HINDSIGHT_API_CONSOLIDATION_RECALL_BUDGET = "low"
# HINDSIGHT_API_CONSOLIDATION_MAX_TOKENS = "384"
# HINDSIGHT_API_CONSOLIDATION_LLM_TIMEOUT = "180"
# HINDSIGHT_API_CONSOLIDATION_LLM_MAX_CONCURRENT = "1"
# HINDSIGHT_API_WORKER_CONSOLIDATION_MAX_SLOTS = "1"
# HINDSIGHT_API_WORKER_MAX_SLOTS = "10"
# HINDSIGHT_API_ENABLE_OBSERVATIONS = "false"

# some things i found 
HINDSIGHT_API_WORKER_CONSOLIDATION_MAX_SLOTS = "8"
HINDSIGHT_API_WORKER_MAX_SLOTS = "20"