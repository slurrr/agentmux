[stack]
name = "pi-vera"
track = "lab"
primary_service = "llm"
notes = "Tool-capable gemma4-E4B-it for agentic workflows in pi-ghosty with memory"

[defaults]
host = "0.0.0.0"

[defaults.env]

[defaults.args]
dtype = "bfloat16"
gpu_memory_utilization = 0.95
max_num_seqs = 12
tensor_parallel_size = 1

[services.llm]
engine = "vllm"
runtime_bin_dir = ".venv-vllm/bin"
model = "${MODEL_ROOT}/hf-snapshots/gemma-4-e4b-it/current"
port = 8002
# host = "127.0.0.1"
served_model_name = "gemma-4-e4b"
# notes = ""
extra_args = ["--disable-uvicorn-access-log"]

[services.llm.env]
CUDA_VISIBLE_DEVICES = "0"
VLLM_MEMORY_PROFILER_ESTIMATE_CUDAGRAPHS = "1"
PYTORCH_CUDA_ALLOC_CONF = "expandable_segments:True"

[services.llm.args]
enable_prefix_caching = true
max_model_len = 131072
enable_auto_tool_choice = true
tool_call_parser = "gemma4"
reasoning_parser = "gemma4"
exclude_tools_when_tool_choice_none = true
# performance_mode = "interactivity"
enable_force_include_usage = true
# attention_backend = "FLASH_ATTN"
chat_template = "assets/chat_templates/tool_chat_template_gemma4.jinja"
chat_template_content_format = "openai"
generation_config = "auto"
default_chat_template_kwargs = "{\"enable_thinking\":true}" 
async_scheduling = true 
# kv_cache_memory_bytes overrides estimate for kv cache and does not respect gpu_memory_utilization
# kv_cache_memory_bytes = "11156174991"
# kv_cache_dtype = "fp8_e4m3"
# calculate_kv_scales = true
structured_outputs_config = '{"backend":"xgrammar","reasoning_parser":"gemma4","enable_in_reasoning":false,"disable_any_whitespace":false}'

[services.llm.assets]

[services.memory]
engine = "hindsight"
host = "127.0.0.1"
port = 8888
runtime_bin_dir = ".venv-hindsight/bin"
data_dir = "${HINDSIGHT_DATA_ROOT}"
llm_service = "llm"

[services.memory.env]
HINDSIGHT_API_EMBEDDINGS_PROVIDER = "local"
HINDSIGHT_API_EMBEDDINGS_LOCAL_FORCE_CPU = "true"

HINDSIGHT_API_RERANKER_PROVIDER = "local"
# GPU test: leave this commented to allow the small local reranker onto GPU.
# HINDSIGHT_API_RERANKER_LOCAL_FORCE_CPU = "true"
HINDSIGHT_API_RERANKER_LOCAL_BUCKET_BATCHING = "true"

HINDSIGHT_API_LAZY_RERANKER = "true"

# First consolidation knobs to test.
# Goal: reduce prompt size / per-round work before touching worker topology.
HINDSIGHT_API_CONSOLIDATION_LLM_BATCH_SIZE = "4"
HINDSIGHT_API_CONSOLIDATION_MAX_MEMORIES_PER_ROUND = "32"
HINDSIGHT_API_CONSOLIDATION_SOURCE_FACTS_MAX_TOKENS = "2048"
HINDSIGHT_API_CONSOLIDATION_SOURCE_FACTS_MAX_TOKENS_PER_OBSERVATION = "160"

# Optional follow-up knobs if the first set is still too slow.
# HINDSIGHT_API_CONSOLIDATION_RECALL_BUDGET = "low"
# HINDSIGHT_API_CONSOLIDATION_MAX_TOKENS = "384"
# HINDSIGHT_API_CONSOLIDATION_LLM_TIMEOUT = "180"
# HINDSIGHT_API_CONSOLIDATION_LLM_MAX_CONCURRENT = "1"
# HINDSIGHT_API_WORKER_CONSOLIDATION_MAX_SLOTS = "1"
# HINDSIGHT_API_WORKER_MAX_SLOTS = "10"
# HINDSIGHT_API_ENABLE_OBSERVATIONS = "false"
