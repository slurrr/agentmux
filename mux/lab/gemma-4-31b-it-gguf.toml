[stack]
name = "gem-mem"
track = "lab"
primary_service = "llm"
notes = "Gemma4-E4B-it agent stack with memory | gemma-style defaults with a tool chat template"

[defaults]
host = "0.0.0.0"

[defaults.args]
dtype = "bfloat16"
gpu_memory_utilization = 0.96
max_num_seqs = 12
tensor_parallel_size = 1

[services.llm]
engine = "vllm"
runtime_bin_dir = ".venv-vllm/bin"
model = "/home/poop/models/hf/hub/models--unsloth--gemma-4-31B-it-GGUF/snapshots/3f07b20fc8e73cec677713305971e534fe8c4ce3/gemma-4-31B-it-UD-Q3_K_XL.gguf"
port = 8002
served_model_name = "gemma-4-e4b-memory"
extra_args = ["--disable-uvicorn-access-log"]

[services.llm.args]
enable_prefix_caching = true
max_model_len = 65536
enable_auto_tool_choice = true
tool_call_parser = "gemma4"
reasoning_parser = "gemma4"
exclude_tools_when_tool_choice_none = true
enable_force_include_usage = true
chat_template_content_format = "openai"
generation_config = "vllm"
# default_chat_template_kwargs = "{\"enable_thinking\":false}"
async_scheduling = true
structured_outputs_config = '{"backend":"xgrammar","reasoning_parser":"gemma4","enable_in_reasoning":false,"disable_any_whitespace":true}'

[services.llm.assets]
chat_template = "assets/chat_templates/tool_chat_template_gemma4.jinja"

[services.memory]
engine = "hindsight"
host = "127.0.0.1"
port = 8888
runtime_bin_dir = ".venv-hindsight/bin"
data_dir = "/home/poop/data/hindsight"
llm_service = "llm"

[services.memory.env]
HINDSIGHT_API_EMBEDDINGS_PROVIDER = "local"
HINDSIGHT_API_EMBEDDINGS_LOCAL_FORCE_CPU = "true"
HINDSIGHT_API_RERANKER_PROVIDER = "local"
HINDSIGHT_API_RERANKER_LOCAL_FORCE_CPU = "true"
HINDSIGHT_API_LAZY_RERANKER = "true"
