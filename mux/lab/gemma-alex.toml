[stack]
name = "gemma-alex"
track = "lab"
primary_service = "llm"
notes = "Onboarded from /home/poop/models/hf/hub/models--OBLITERATUS--gemma-4-E4B-it-OBLITERATED/snapshots/d8678bbb9e0d4f5729c115087485a4e25ba89d65 | gemma gguf defaults with a tool chat template"

[defaults]
host = "127.0.0.1"

[defaults.env]
CUDA_VISIBLE_DEVICES = "0"

[services.llm]
engine = "llamacpp"

# If you prefer explicitness, uncomment and point at a dir containing llama-server.
# runtime_bin_dir = "~/.local/bin"

# Model source via Hugging Face repo (llama.cpp will resolve/download/cache).
hf_repo = "OBLITERATUS/gemma-4-E4B-it-OBLITERATED"
hf_file = "gemma-4-E4B-it-OBLITERATED-Q8_0.gguf"

# Optional direct-file alternative:
# model = "/home/poop/models/local/gguf/gemma-alex.gguf"

host = "127.0.0.1"
port = 8002

# Optional: informational label.
served_model_name = "gemma-alex"

# Minimal GPU-serving baseline (order-independent).
# If this fails due to VRAM pressure, try:
# - n_gpu_layers = "auto" (instead of "all")
# - smaller ctx_size
# - lower parallel

[services.llm.args]
n_gpu_layers = "all"
threads = 8
ctx_size = 131072

# Global generation cap for requests that omit max_tokens.
# (-1 is infinity; 1024-4096 is usually safer for interactive chat)
predict = 16384

# Keep concurrency conservative for large-context single-user work.
parallel = 1

# Server-side sampling defaults (used when client omits sampling params).
temperature = 0.7
top_k = 125
# top_p = 0.9
min_p = 0.05
# typical_p = 1.0
# repeat_penalty = 1.05
# repeat_last_n = 128
presence_penalty = 0.75
# frequency_penalty = 0.0
seed = -1

# Optional tuning knobs:
# cont_batching = true
# batch_size = 2048
# ubatch_size = 512
# cache_prompt = true
# cache_ram = 8192
# reasoning = "off"
# reasoning_budget = 0
flash_attn = "auto"
# chat_template = "gemma"

# Keep explicit mmproj path for now (known-good on this machine).
mmproj = "/home/poop/models/hf/hub/models--OBLITERATUS--gemma-4-E4B-it-OBLITERATED/snapshots/d8678bbb9e0d4f5729c115087485a4e25ba89d65/gemma-4-E4B-it-OBLITERATED-mmproj-f16.gguf"


