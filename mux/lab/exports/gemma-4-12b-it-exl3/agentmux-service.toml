[agentmux_export]
version = 1
name = "gemma-4-12b-it-exl3"
backend = "exl3-tabby"
notes = "Transitional AgentMux-side export. Future exports should be generated by workspace-exl3."

[service]
image = "localhost/llm-tabby:latest"
port = 8002
health_path = "/v1/models"
runtime_target = "/app/data"
podman_args = ["--security-opt", "label=disable", "--device", "nvidia.com/gpu=all"]

[service.env]
HF_HOME = "/models/hf"

[[service.volumes]]
source = "~/models"
target = "/models"
mode = "ro"

[[service.volumes]]
source = "~/code/dev/workspace-exl3/configs/deployments/gemma-4-12b-it-stable.yml"
target = "/app/tabbyAPI/config.yml"
mode = "ro"

[[service.volumes]]
source = "~/code/dev/workspace-exl3/configs/templates"
target = "/app/tabbyAPI/templates"
mode = "ro"

[[service.volumes]]
source = "~/code/dev/workspace-exl3/configs/sampler_overrides"
target = "/app/tabbyAPI/sampler_overrides"
mode = "ro"

[[service.volumes]]
source = "~/code/dev/workspace-exl3/configs/loras"
target = "/app/tabbyAPI/loras"
mode = "ro"

[[service.volumes]]
source = "~/code/dev/workspace-exl3/configs/api_tokens.yml"
target = "/app/tabbyAPI/api_tokens.yml"
mode = "ro"
