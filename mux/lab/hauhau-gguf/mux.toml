[mux]
name = "hauhau-gguf"
primary_service = "main"
notes = "Lab-editable AgentMux export for proven hauhau GGUF llama.cpp serving preset from workspace-gguf."

[services.main]
image = "localhost/llm-gguf:latest"
container_name = "agentmux-hauhau-gguf-main"
port = 8002
container_port = 5000
podman_args = ["--security-opt", "label=disable", "--device", "nvidia.com/gpu=all"]
health_path = "/v1/models"
command = ["/bin/bash", "/mux-config/launch-llama-server.sh"]

[[services.main.volumes]]
source = "/home/poop/models/hf/hub/models--HauhauCS--Qwen3.6-35B-A3B-Uncensored-HauhauCS-Aggressive/snapshots/f12a584fecbeb5f20001130d8ecd66c9327ae685/Qwen3.6-35B-A3B-Uncensored-HauhauCS-Aggressive-Q3_K_P.gguf"
target = "/mux-models/hauhau.gguf"
mode = "ro"

[[services.main.volumes]]
source = "./config"
target = "/mux-config"
mode = "ro"
