[stack]
name = "gem-heretic"
track = "lab"
primary_service = "main"
notes = "Onboarded from /home/poop/models/hf/hub/models--coder3101--gemma-4-E4B-it-heretic/snapshots/24a5d4b1967adfb1421ba8125ce5f05b7214b5ab | gemma-style defaults with a tool chat template"

[defaults]
host = "0.0.0.0"

[defaults.args]
dtype = "bfloat16"
gpu_memory_utilization = 0.9
max_num_seqs = 36
tensor_parallel_size = 1
enable_prefix_caching = true
enable_force_include_usage = true
load_format = "auto"
# enable_auto_tool_choice = true
tool_call_parser = "gemma4"
reasoning_parser = "gemma4"
exclude_tools_when_tool_choice_none = true
chat_template_content_format = "openai"
generation_config = "auto"
# default_chat_template_kwargs = "{\"enable_thinking\":true}"
# structured_outputs_config = "{\"backend\":\"xgrammar\",\"reasoning_parser\":\"gemma4\",\"enable_in_reasoning\":false,\"disable_any_whitespace\":false}"
async_scheduling = true
max_model_len = 131072
kv_cache_dtype = "fp8_e4m3"

[services.main]
engine = "vllm"
runtime_bin_dir = ".venv-vllm/bin"
model = "/home/poop/models/active/gemma-4-e4b-it-heretic"
port = 8002
served_model_name = "gemma-4-e4b-heretic"
extra_args = ["--disable-uvicorn-access-log"]

[services.main.assets]
chat_template = "assets/chat_templates/tool_chat_template_gemma4.jinja"
