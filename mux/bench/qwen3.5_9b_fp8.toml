[stack]
name = "qwen3_5-fp8-bench"
track = "bench"
primary_service = "main"
notes = "qwen3.5_9b with fp8 block selective weights"

[defaults.args]
dtype = "auto"
load_format = "auto"
max_num_seqs = 10

[services.main]
engine = "vllm"
runtime_bin_dir = ".venv-vllm/bin"
model = "${QUANT_ROOT}/llm-compressor-artifacts/qwen3.5-9b-fp8-block"
served_model_name = "qwen3.5_9b_fp8"
host = "127.0.0.1"
port = 8100
notes = "Phase-1 benchmark baseline: modest context, stable Qwen serving shape, and no benchmark-specific hacks."

[services.main.env]
CUDA_VISIBLE_DEVICES = "0"
VLLM_MEMORY_PROFILER_ESTIMATE_CUDAGRAPHS = "0"
PYTORCH_CUDA_ALLOC_CONF = "expandable_segments:True"

[services.main.args]
enable_prefix_caching = true
max_model_len = 8192
generation_config = "vllm"
gpu_memory_utilization = 0.95
# enable_auto_tool_choice = true
# tool_call_parser = "qwen3_xml"
reasoning_parser = "qwen3"
# exclude_tools_when_tool_choice_none = true
# enable-force-include-usage = true
chat_template_content_format = "openai"
default_chat_template_kwargs = "{\"enable_thinking\":false}"
# kv_cache_dtype = "fp8_e4m3"

[services.main.assets]
chat_template = "assets/chat_templates/qwen3_codex_compat.jinja"
