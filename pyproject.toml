[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "agentmux"
version = "0.2.0"
description = "Container-first launch cockpit for local agent-serving stacks"
readme = "README.md"
requires-python = ">=3.12"
dependencies = []

[project.scripts]
agentmux = "agentmux.main:main"

[dependency-groups]
dev = ["pytest>=8.0.0", "ruff>=0.11.0"]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.pyright]
venv = ".venv"

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "W"]
